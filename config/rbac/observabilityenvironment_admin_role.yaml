# This rule is not used by the project obs-onboarding-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over obs.acme.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: obs-onboarding-controller
    app.kubernetes.io/managed-by: kustomize
  name: observabilityenvironment-admin-role
rules:
- apiGroups:
  - obs.acme.com
  resources:
  - observabilityenvironments
  verbs:
  - '*'
- apiGroups:
  - obs.acme.com
  resources:
  - observabilityenvironments/status
  verbs:
  - get
