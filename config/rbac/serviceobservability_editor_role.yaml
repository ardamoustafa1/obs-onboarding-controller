# This rule is not used by the project obs-onboarding-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the obs.acme.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: obs-onboarding-controller
    app.kubernetes.io/managed-by: kustomize
  name: serviceobservability-editor-role
rules:
- apiGroups:
  - obs.acme.com
  resources:
  - serviceobservabilities
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - obs.acme.com
  resources:
  - serviceobservabilities/status
  verbs:
  - get
