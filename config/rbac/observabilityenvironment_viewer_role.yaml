# This rule is not used by the project obs-onboarding-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to obs.acme.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: obs-onboarding-controller
    app.kubernetes.io/managed-by: kustomize
  name: observabilityenvironment-viewer-role
rules:
- apiGroups:
  - obs.acme.com
  resources:
  - observabilityenvironments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - obs.acme.com
  resources:
  - observabilityenvironments/status
  verbs:
  - get
