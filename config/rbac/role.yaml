---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - monitoring.coreos.com
  resources:
  - podmonitors
  - prometheusrules
  - servicemonitors
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - obs.acme.com
  resources:
  - observabilityenvironments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - obs.acme.com
  resources:
  - observabilityenvironments/status
  - serviceobservabilities/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - obs.acme.com
  resources:
  - serviceobservabilities
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - obs.acme.com
  resources:
  - serviceobservabilities/finalizers
  verbs:
  - update
