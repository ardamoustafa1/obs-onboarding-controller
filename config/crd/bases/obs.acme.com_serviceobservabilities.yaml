---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: serviceobservabilities.obs.acme.com
spec:
  group: obs.acme.com
  names:
    kind: ServiceObservability
    listKind: ServiceObservabilityList
    plural: serviceobservabilities
    singular: serviceobservability
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.serviceType
      name: Service Type
      type: string
    - jsonPath: .spec.environment
      name: Environment
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: ServiceObservability is the Schema for the serviceobservabilities
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ServiceObservability
            properties:
              alerting:
                description: AlertingSpec mirrors obs-manifest-schema's $defs/alerting.
                properties:
                  burnRateAlerts:
                    default: true
                    description: |-
                      burnRateAlerts enables the generated multi-window multi-burn-rate,
                      latency-SLO and saturation PrometheusRule groups.
                    type: boolean
                  extraRules:
                    description: extraRules are merged into their own "<service>.extra"
                      rule group.
                    items:
                      description: |-
                        ExtraAlertRule is a hand-authored alert rule merged alongside the
                        generated burn-rate/latency/saturation rules. Mirrors
                        obs-alert-rule-templates' internal/manifest.ExtraRule.
                      properties:
                        expr:
                          type: string
                        for:
                          type: string
                        name:
                          type: string
                        severity:
                          enum:
                          - page
                          - warning
                          type: string
                        summary:
                          type: string
                      required:
                      - expr
                      - name
                      - severity
                      type: object
                    type: array
                required:
                - burnRateAlerts
                type: object
              dashboards:
                description: DashboardsSpec mirrors obs-manifest-schema's $defs/dashboards.
                properties:
                  template:
                    description: |-
                      template selects the obs-golden-signal-templates entry point, e.g.
                      "http-service-v2". Must match spec.serviceType.
                    type: string
                required:
                - template
                type: object
              environment:
                description: |-
                  environment must match the name of an ObservabilityEnvironment
                  object; that object supplies the Grafana instance, Prometheus rule
                  namespace, and catalog endpoint this service is onboarded into.
                enum:
                - dev
                - staging
                - prod
                type: string
              goldenSignals:
                description: GoldenSignalsSpec mirrors obs-manifest-schema's $defs/goldenSignals.
                properties:
                  errorMetric:
                    description: errorMetric is the Prometheus counter of failed requests/jobs.
                    type: string
                  latencyMetric:
                    description: |-
                      latencyMetric is the base name (without _bucket) of a Prometheus
                      histogram. Required for http, grpc, and database service types.
                    type: string
                  processingDurationMetric:
                    description: |-
                      processingDurationMetric is the worker/batch equivalent of
                      latencyMetric. Required for worker and batch service types.
                    type: string
                  saturationMetrics:
                    description: |-
                      saturationMetrics are 0..1 utilization-ratio gauges (CPU, memory,
                      queue depth, ...) used for saturation early-warning alerts.
                    items:
                      type: string
                    minItems: 1
                    type: array
                  trafficMetric:
                    description: |-
                      trafficMetric is the Prometheus counter used as the request-volume
                      denominator for error ratio and burn-rate calculations.
                    type: string
                required:
                - errorMetric
                - saturationMetrics
                - trafficMetric
                type: object
              ownership:
                description: OwnershipSpec mirrors obs-manifest-schema's v2 $defs/ownership.
                properties:
                  pagerDutyService:
                    type: string
                  slackChannel:
                    pattern: ^#[a-z0-9_-]+$
                    type: string
                  team:
                    pattern: ^[a-z0-9][a-z0-9._/-]*$
                    type: string
                required:
                - pagerDutyService
                - slackChannel
                - team
                type: object
              scrapeConfig:
                description: |-
                  scrapeConfig, if set, causes the operator to generate a
                  ServiceMonitor (or PodMonitor) so Prometheus starts scraping this
                  service automatically.
                properties:
                  interval:
                    default: 30s
                    description: interval is the scrape interval, e.g. "30s".
                    type: string
                  path:
                    default: /metrics
                    description: path is the metrics HTTP path.
                    type: string
                  podMonitor:
                    description: |-
                      podMonitor selects a PodMonitor instead of a ServiceMonitor, for
                      services without a stable Service object (e.g. some batch/worker
                      deployments).
                    type: boolean
                  port:
                    description: port is the named port to scrape.
                    type: string
                  selector:
                    description: selector picks the Service (or Pod, if podMonitor
                      is true) to scrape.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                required:
                - port
                - selector
                type: object
              serviceType:
                description: ServiceType mirrors obs-manifest-schema's spec.serviceType
                  enum.
                enum:
                - http
                - grpc
                - worker
                - batch
                - database
                type: string
              slo:
                description: SLOSpec mirrors obs-manifest-schema's $defs/slo.
                properties:
                  availabilityTarget:
                    description: |-
                      availabilityTarget is the fraction of requests expected to succeed
                      over the 30 day SLO window, e.g. 0.999 for "three nines".
                    maximum: 0.999999
                    minimum: 0.9
                    type: number
                  latencyPercentile:
                    description: latencyPercentile is the percentile the latency target
                      applies to.
                    enum:
                    - 50
                    - 90
                    - 95
                    - 99
                    format: int32
                    type: integer
                  latencyTargetMs:
                    description: |-
                      latencyTargetMs is the maximum acceptable latency, in milliseconds,
                      at latencyPercentile.
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - availabilityTarget
                - latencyPercentile
                - latencyTargetMs
                type: object
            required:
            - alerting
            - dashboards
            - environment
            - goldenSignals
            - ownership
            - serviceType
            - slo
            type: object
          status:
            description: status defines the observed state of ServiceObservability
            properties:
              conditions:
                description: |-
                  conditions report the outcome of each reconcile aspect independently:
                  Ready, DashboardSynced, AlertsSynced, ServiceMonitorSynced, CatalogSynced.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              dashboardUID:
                description: dashboardUID is the Grafana dashboard UID once published.
                type: string
              dashboardURL:
                description: dashboardURL is the browsable Grafana dashboard URL.
                type: string
              lastReconcileTime:
                description: |-
                  lastReconcileTime is when the reconciler last ran to completion
                  (successfully or not).
                format: date-time
                type: string
              observedGeneration:
                description: |-
                  observedGeneration is the .metadata.generation the status was last
                  computed from; used to tell a stale status from a current one.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
