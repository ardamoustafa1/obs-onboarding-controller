---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: observabilityenvironments.obs.acme.com
spec:
  group: obs.acme.com
  names:
    kind: ObservabilityEnvironment
    listKind: ObservabilityEnvironmentList
    plural: observabilityenvironments
    singular: observabilityenvironment
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.grafana.url
      name: Grafana
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          ObservabilityEnvironment is the Schema for the observabilityenvironments API.
          Its name (metadata.name) is the value ServiceObservability.spec.environment
          references, e.g. "dev", "staging", "prod".
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ObservabilityEnvironment
            properties:
              catalog:
                description: |-
                  CatalogSpec configures the service-catalog REST API this environment
                  registers services with (see cmd/catalog).
                properties:
                  apiTokenSecretRef:
                    description: apiTokenSecretRef optionally authenticates catalog
                      writes.
                    properties:
                      key:
                        description: key within the Secret's data.
                        type: string
                      name:
                        description: |-
                          name of the Secret, in the same namespace the operator runs in
                          unless namespace is set.
                        type: string
                      namespace:
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  url:
                    description: url is the catalog API base URL, e.g. http://obs-catalog.obs-system.svc:8080.
                    type: string
                required:
                - url
                type: object
              displayName:
                description: displayName is a human-friendly label, purely cosmetic.
                type: string
              grafana:
                description: |-
                  GrafanaSpec configures the Grafana instance this environment publishes
                  dashboards to.
                properties:
                  apiTokenSecretRef:
                    description: |-
                      apiTokenSecretRef points at a Secret key holding a Grafana service
                      account token with dashboard:write and folders:write scope.
                    properties:
                      key:
                        description: key within the Secret's data.
                        type: string
                      name:
                        description: |-
                          name of the Secret, in the same namespace the operator runs in
                          unless namespace is set.
                        type: string
                      namespace:
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  folderPrefix:
                    default: team-
                    description: |-
                      folderPrefix namespaces Grafana folders per team, e.g. "team-" turns
                      team "checkout" into folder UID "team-checkout" -- kept consistent
                      with the RBAC repo's folder-per-team convention.
                    type: string
                  url:
                    description: url is the Grafana base URL, e.g. https://grafana.prod.acme.internal.
                    pattern: ^https?://
                    type: string
                required:
                - apiTokenSecretRef
                - url
                type: object
              prometheus:
                description: |-
                  PrometheusSpec configures where generated PrometheusRule/ServiceMonitor
                  objects land and how Prometheus Operator is expected to discover them.
                properties:
                  additionalLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      additionalLabels are stamped onto every generated PrometheusRule and
                      ServiceMonitor so the environment's Prometheus Operator
                      ruleSelector/serviceMonitorSelector picks them up, e.g.
                      {"release": "kube-prometheus-stack"}.
                    type: object
                  ruleNamespace:
                    description: |-
                      ruleNamespace is where PrometheusRule/ServiceMonitor objects are
                      created. Defaults to the ServiceObservability's own namespace when
                      empty.
                    type: string
                type: object
            required:
            - catalog
            - grafana
            - prometheus
            type: object
          status:
            description: status defines the observed state of ObservabilityEnvironment
            properties:
              conditions:
                description: |-
                  conditions reports whether the referenced secrets currently resolve
                  and the Grafana/catalog endpoints are reachable.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
