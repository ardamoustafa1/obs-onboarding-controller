apiVersion: v1
kind: Service
metadata:
  name: {{ include "obs-onboarding-controller.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "obs-onboarding-controller.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  selector:
    {{- include "obs-onboarding-controller.labels" . | nindent 4 }}
    control-plane: controller-manager
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
