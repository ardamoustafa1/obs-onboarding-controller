# Example: syncing the Grafana API token from Vault via External Secrets
# Operator (https://external-secrets.io/) into the plain core/v1 Secret this
# operator reads (see internal/envresolve and ObservabilityEnvironment's
# grafana.apiTokenSecretRef). The operator never talks to Vault, ESO, or any
# secret manager directly -- ESO does that sync and lands a normal Secret;
# this operator only ever reads that Secret through the Kubernetes API. See
# README.md ("Güvenlik / secret yönetimi").
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: obs-system
spec:
  provider:
    vault:
      server: "https://vault.acme.internal:8200"
      path: "secret"
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: obs-onboarding-controller
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-prod-api-token
  namespace: obs-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    # Same name/key the ObservabilityEnvironment sample
    # (config/samples/obs_v1_observabilityenvironment.yaml) references.
    name: grafana-prod-api-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: obs-platform/grafana-prod
        property: api-token
